[project]
name = "bigmap"
version = "1.1.0"
description = "The Biosynthetic Gene cluster Meta'omics Abundance Profiler"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Koen van den Berg" },
    { name = "Hannah Augustijn" },
    { name = "Victòria Pascal Andreu" },
    { name = "Nico Louwen" },
]

[project.scripts]
"bigmap-download" = "bigmap.download:main"
"bigmap-family" = "bigmap.family:main"
"bigmap-map" = "bigmap.map:main"
"bigmap-analyse" = "bigmap.analyse:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"bigmap" = "bigmap"

[tool.hatch.envs.bigmap]
type = "conda"
command = "mamba"
environment-file = "environment.yml"
